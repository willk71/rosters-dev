<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Welcome to IPX! &ndash; Live Session Rosters</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #242426 0%, #121214 65%, #000000 100%);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-border-active: rgba(255, 214, 10, 0.85);

      --yellow: #ffd60a;
      --text-main: #ffffff;
      --text-sub: #ebebf5;
      --text-muted: #8e8e93;

      --accent-green: #34c759;
      --accent-green-glow: rgba(52, 199, 89, 0.65);

      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    /* 1. Tiffany Morning: Petrol & Mint Frost (7:00 AM & 9:00 AM) */
    body.theme-tiffany {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0d2826 0%, #061514 60%, #020707 100%);
      --yellow: #2de2b6;
      --card-bg: rgba(45, 226, 182, 0.09);
      --card-border: rgba(45, 226, 182, 0.28);
      --card-border-active: rgba(45, 226, 182, 0.85);
    }
    body.theme-tiffany .count-badge {
      background: rgba(45, 226, 182, 0.25);
      border-color: #2de2b6;
      color: #ffffff;
    }
    body.theme-tiffany .roster-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(45, 226, 182, 0.05);
    }

    /* 2. US Open Afternoon: Arthur Ashe Navy & Optic Volt (11:00 AM - 5:00 PM) */
    body.theme-usopen {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0a2540 0%, #051329 60%, #020712 100%);
      --yellow: #ccff00;
      --card-bg: rgba(10, 37, 64, 0.7);
      --card-border: rgba(204, 255, 0, 0.3);
      --card-border-active: rgba(204, 255, 0, 0.9);
    }
    body.theme-usopen .count-badge {
      background: rgba(204, 255, 0, 0.22);
      border-color: #ccff00;
      color: #ffffff;
    }
    body.theme-usopen .roster-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(204, 255, 0, 0.06);
    }

    /* 3. Apple Prime: OLED Black & Canary Yellow (5:30 PM - 7:00 PM) */
    body.theme-apple {
      --bg-gradient: radial-gradient(circle at 50% 10%, #242426 0%, #121214 65%, #000000 100%);
      --yellow: #ffd60a;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-border-active: rgba(255, 214, 10, 0.85);
    }
    body.theme-apple .count-badge {
      background: rgba(255, 214, 10, 0.22);
      border-color: #ffd60a;
      color: #ffffff;
    }

    /* 4. Rolex Evening: British Racing Green & Champagne Gold (7:30 PM - 9:00 PM) */
    body.theme-rolex {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0e2417 0%, #07130c 60%, #020503 100%);
      --yellow: #e5c158;
      --card-bg: rgba(14, 36, 23, 0.65);
      --card-border: rgba(229, 193, 88, 0.3);
      --card-border-active: rgba(229, 193, 88, 0.9);
    }
    body.theme-rolex .count-badge {
      background: rgba(229, 193, 88, 0.22);
      border-color: #e5c158;
      color: #ffffff;
    }
    body.theme-rolex .roster-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(229, 193, 88, 0.05);
    }

    /* 5. Porsche Late Night: Carbon Gunmetal & Signal Amber (9:30 PM onward) */
    body.theme-porsche {
      --bg-gradient: radial-gradient(circle at 50% 10%, #2a1b12 0%, #150d09 60%, #050302 100%);
      --yellow: #ff9f0a;
      --card-bg: rgba(42, 27, 18, 0.55);
      --card-border: rgba(255, 159, 10, 0.32);
      --card-border-active: rgba(255, 159, 10, 0.9);
    }
    body.theme-porsche .count-badge {
      background: rgba(255, 159, 10, 0.25);
      border-color: #ff9f0a;
      color: #ffffff;
    }
    body.theme-porsche .roster-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(255, 159, 10, 0.08);
    }

    /* 6. Roland-Garros: Paris Smoked Clay & Scorched Orange */
    body.theme-rolandgarros {
      --bg-gradient: radial-gradient(circle at 50% 10%, #301712 0%, #160a08 60%, #060202 100%);
      --yellow: #ff6e40;
      --card-bg: rgba(48, 23, 18, 0.65);
      --card-border: rgba(255, 110, 64, 0.35);
      --card-border-active: rgba(255, 110, 64, 0.95);
    }
    body.theme-rolandgarros .count-badge {
      background: rgba(255, 110, 64, 0.25);
      border-color: #ff6e40;
      color: #ffffff;
    }
    body.theme-rolandgarros .roster-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 0 24px rgba(255, 110, 64, 0.08);
    }

    /* 7. Australian Open: Melbourne Oceanic Trench & Laser Cyan */
    body.theme-ausopen {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0a2b47 0%, #041424 60%, #01060d 100%);
      --yellow: #00f5d4;
      --card-bg: rgba(7, 36, 64, 0.7);
      --card-border: rgba(0, 245, 212, 0.35);
      --card-border-active: rgba(0, 245, 212, 0.95);
    }
    body.theme-ausopen .count-badge {
      background: rgba(0, 245, 212, 0.22);
      border-color: #00f5d4;
      color: #ffffff;
    }
    body.theme-ausopen .roster-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 0 25px rgba(0, 245, 212, 0.08);
    }

    /* 8. Miami Vice: Dark Velvet Plum & Electric Hot Pink */
    body.theme-vice {
      --bg-gradient: radial-gradient(circle at 50% 10%, #290d33 0%, #130519 60%, #040106 100%);
      --yellow: #ff2a85;
      --card-bg: rgba(40, 14, 48, 0.65);
      --card-border: rgba(255, 42, 133, 0.32);
      --card-border-active: rgba(255, 42, 133, 0.95);
    }
    body.theme-vice .count-badge {
      background: rgba(255, 42, 133, 0.22);
      border-color: #ff2a85;
      color: #ffffff;
    }
    body.theme-vice .roster-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(255, 42, 133, 0.08);
    }

    /* 9. Gulf Racing: Le Mans Petrol Blue & Tangerine Orange */
    body.theme-gulfracing {
      --bg-gradient: radial-gradient(circle at 50% 10%, #152b33 0%, #0b171c 60%, #020506 100%);
      --yellow: #ff7800;
      --card-bg: rgba(18, 41, 51, 0.65);
      --card-border: rgba(255, 120, 0, 0.35);
      --card-border-active: rgba(255, 120, 0, 0.95);
    }
    body.theme-gulfracing .count-badge {
      background: rgba(255, 120, 0, 0.24);
      border-color: #ff7800;
      color: #ffffff;
    }
    body.theme-gulfracing .roster-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 0 24px rgba(255, 120, 0, 0.08);
    }

    /* 10. Masters: Augusta Deep Pine & Azalea Gold */
    body.theme-masters {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0b291d 0%, #05140e 60%, #010403 100%);
      --yellow: #f5b700;
      --card-bg: rgba(10, 38, 27, 0.68);
      --card-border: rgba(245, 183, 0, 0.32);
      --card-border-active: rgba(245, 183, 0, 0.92);
    }
    body.theme-masters .count-badge {
      background: rgba(245, 183, 0, 0.22);
      border-color: #f5b700;
      color: #ffffff;
    }
    body.theme-masters .roster-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 0 24px rgba(245, 183, 0, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 2.2vh 3vw 1.5vh 3vw;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1.2vh;
      flex-shrink: 0;
      gap: 2vw;
    }

    .header-left {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: baseline;
    }

    .header-left h1 {
      font-size: clamp(2rem, 3vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: baseline;
    }

    .header-separator {
      margin: 0 0.55em;
      color: var(--text-muted);
      font-weight: 300;
      opacity: 0.7;
    }

    .header-window {
      color: var(--yellow);
      font-weight: 600;
      margin-left: 0.4em;
    }

    .header-right {
      display: flex;
      align-items: baseline;
      flex-shrink: 0;
      text-align: right;
    }

    .clock {
      font-size: clamp(2.4rem, 3.5vw, 4rem);
      font-weight: 300;
      color: var(--yellow);
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: grid;
      gap: 1.6vh 1.6vw;
      margin-top: 1.8vh;
      overflow: hidden;
      min-height: 0;
    }

    main.count-1 { grid-template-columns: 1fr 1fr; }
    main.count-2 { grid-template-columns: 1fr 1fr; }
    main.count-3 { grid-template-columns: 1fr 1fr 1fr; }
    main.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    main.count-5, main.count-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .roster-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 10px solid var(--yellow);
      border-radius: 18px;
      padding: 1.8vh 1.8vw;
      display: flex;
      flex-direction: column;
      gap: 1.2vh;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      min-height: 0;
      overflow: hidden;
    }

    .roster-card.single-session {
      grid-column: 1 / 2;
    }

    .roster-card.is-now {
      border-color: var(--card-border-active);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 1vh;
      flex-shrink: 0;
    }

    .header-titles {
      display: flex;
      flex-direction: column;
      gap: 0.35vh;
      min-width: 0;
    }

    .line-title {
      font-size: var(--title-font-size, clamp(2.0rem, 2.5vw, 3.15rem));
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .line-courts {
      font-size: var(--courts-font-size, clamp(1.55rem, 2.0vw, 2.4rem));
      font-weight: 600;
      color: var(--yellow);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .card-meta {
      text-align: right;
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .count-badge {
      font-size: clamp(0.85rem, 1.0vw, 1.15rem);
      color: #ffffff;
      background: rgba(255, 214, 10, 0.2);
      border: 1px solid rgba(255, 214, 10, 0.4);
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .player-list {
      column-count: var(--roster-cols, 2);
      column-gap: var(--roster-col-gap, 1.8vw);
      column-fill: auto;
      flex: 1;
      overflow: hidden;
    }

    .player-item {
      font-size: var(--roster-font-size, clamp(0.95rem, 1.1vw, 1.3rem));
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: var(--roster-row-gap, 0.7vh);
      break-inside: avoid;
      page-break-inside: avoid;
      display: flex;
      align-items: center;
      gap: 0.55em;
    }

    .status-dot {
      display: inline-block;
      width: 0.55em;
      height: 0.55em;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Checked-in: Bright text + glowing green dot */
    .player-item.is-checked-in {
      color: var(--text-main);
      opacity: 1;
    }
    .player-item.is-checked-in .status-dot {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green-glow);
    }

    /* Pending: Dimmed text + subtle outline dot */
    .player-item.is-pending {
      color: var(--text-muted);
      opacity: 0.65;
    }
    .player-item.is-pending .status-dot {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .player-empty {
      font-size: 1.05rem;
      color: var(--text-muted);
      font-style: italic;
      padding-top: 0.5vh;
    }

    footer {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1.2rem;
      padding-top: 0.8vh;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.35);
      font-variant-numeric: tabular-nums;
    }

    footer span {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .no-sessions {
      grid-column: 1 / -1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      text-align: center;
      padding: 6vh;
    }

    .no-sessions h2 {
      font-size: clamp(1.8rem, 2.8vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 id="header-title">
        <span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span id="board-title-text">Rosters</span>
      </h1>
    </div>
    <div class="header-right">
      <div class="clock" id="live-clock">--:-- --</div>
    </div>
  </header>

  <main id="roster-container">
    <div class="no-sessions">
      <h2>Loading Rosters...</h2>
    </div>
  </main>

  <footer>
    <span id="theme-pill">Theme: --</span>
    <span>&bull;</span>
    <span id="target-mode-pill">Target: --</span>
    <span>&bull;</span>
    <span id="data-refresh-time">Data Sync: --</span>
    <span>&bull;</span>
    <span id="page-refresh-time">Display Updated: --</span>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hasExplicitAhead = urlParams.has('ahead');
    const isNamed60 = window.location.pathname.includes('60');
    const defaultAhead = isNamed60 ? '60' : '15';
    const lookaheadMinutes = parseInt(urlParams.get('ahead') || defaultAhead, 10);
    
    const isPreview = hasExplicitAhead && lookaheadMinutes !== 15;

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    const themeDisplayNames = {
      'theme-tiffany': 'Tiffany',
      'theme-usopen': 'US Open',
      'theme-apple': 'Apple',
      'theme-rolex': 'Rolex',
      'theme-porsche': 'Porsche',
      'theme-rolandgarros': 'Roland-Garros',
      'theme-ausopen': 'Australian Open',
      'theme-vice': 'Miami Vice',
      'theme-gulfracing': 'Gulf Racing',
      'theme-masters': 'Masters'
    };

    function applyDynamicTheme(targetTime) {
      const urlTheme = (urlParams.get('theme') || '').toLowerCase().trim();
      const allThemes = [
        'theme-tiffany',
        'theme-usopen',
        'theme-apple',
        'theme-rolex',
        'theme-porsche',
        'theme-rolandgarros',
        'theme-ausopen',
        'theme-vice',
        'theme-gulfracing',
        'theme-masters'
      ];
      
      let themeToApply = 'theme-apple';

      if (urlTheme && allThemes.includes(`theme-${urlTheme}`)) {
        themeToApply = `theme-${urlTheme}`;
      } else {
        const totalMinutes = targetTime.getHours() * 60 + targetTime.getMinutes();

        // 7:00 AM (420) to 10:59 AM (659) -> Sessions starting 7:00 AM & 9:00 AM
        if (totalMinutes >= 420 && totalMinutes < 660) {
          themeToApply = 'theme-tiffany';
        }
        // 11:00 AM (660) to 5:14 PM (1034) -> Sessions starting 11:00 AM - 5:00 PM
        else if (totalMinutes >= 660 && totalMinutes < 1035) {
          themeToApply = 'theme-usopen';
        }
        // 5:15 PM (1035) to 7:14 PM (1154) -> Sessions starting 5:30 PM - 7:00 PM
        else if (totalMinutes >= 1035 && totalMinutes < 1155) {
          themeToApply = 'theme-apple';
        }
        // 7:15 PM (1155) to 9:14 PM (1274) -> Sessions starting 7:30 PM - 9:00 PM
        else if (totalMinutes >= 1155 && totalMinutes < 1275) {
          themeToApply = 'theme-rolex';
        }
        // 9:15 PM (1275) through late night -> Sessions starting 9:30 PM onward
        else {
          themeToApply = 'theme-porsche';
        }
      }

      document.body.classList.remove(...allThemes);
      document.body.classList.add(themeToApply);

      const displayName = themeDisplayNames[themeToApply] || 'Default';
      const themePill = document.getElementById('theme-pill');
      if (themePill) {
        themePill.textContent = `Theme: ${displayName}`;
      }
    }

    function formatTime(isoString, isEndTime = false) {
      if (!isoString) return '';
      const d = new Date(isoString);

      // Override late-night CourtReserve truncations (23:59 -> 1:00 AM)
      if (isEndTime && d.getHours() === 23 && d.getMinutes() === 59) {
        return '1:00 AM';
      }

      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function formatTimeWindow(startIso, endIso) {
      if (!startIso || !endIso) return '';
      const t1 = formatTime(startIso, false);
      const t2 = formatTime(endIso, true);
      const parts1 = t1.split(' ');
      const parts2 = t2.split(' ');
      if (parts1.length === 2 && parts2.length === 2 && parts1[1] === parts2[1]) {
        return `${parts1[0]} \u2013 ${t2}`;
      }
      return `${t1} \u2013 ${t2}`;
    }

    function cleanCourtName(rawName) {
      if (!rawName) return '';
      return String(rawName)
        .replace(/\s*\(\s*Livestreaming\s*\)/gi, '')
        .replace(/\s*\(\s*Streaming\s*\)/gi, '')
        .replace(/^Court\s*/i, '')
        .trim();
    }

    function toSentenceCase(str) {
      if (!str) return '';
      return String(str).replace(/([^\W_]+[^\s-]*) */g, (txt) => {
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
      }).trim();
    }

    function cleanTitle(rawTitle) {
      if (!rawTitle) return '';
      let firstSegment = String(rawTitle).split('|')[0].trim();
      firstSegment = firstSegment
        .replace(/\bSessions?\b/gi, '')
        .replace(/\bOpen\s*Play\b/gi, '')
        .replace(/\bPrime\s*Time\b/gi, '');

      firstSegment = firstSegment.replace(/[-–—/,\s]+$/, '').trim();
      firstSegment = firstSegment.replace(/(\d+(?:\.\d+)?)\s*[-–—]\s*(\d+(?:\.\d+)?)/g, '$1 \u2013 $2');
      return toSentenceCase(firstSegment);
    }

    async function refreshDisplay() {
      try {
        const res = await fetch(`data/schedule.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Schedule file not found");
        const data = await res.json();

        const now = new Date();
        document.getElementById('page-refresh-time').textContent = `Display: ${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true })}`;
        
        if (data.lastUpdated) {
          const syncDate = new Date(data.lastUpdated);
          document.getElementById('data-refresh-time').textContent = `Data Sync: ${syncDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        }

        const targetTime = new Date(now.getTime() + lookaheadMinutes * 60 * 1000);
        const targetTimeString = targetTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });

        // Apply theme 15 minutes before the session starts
        applyDynamicTheme(targetTime);

        document.getElementById('target-mode-pill').textContent = isPreview 
          ? `Target: ${targetTimeString}` 
          : 'Target: Live';

        const isRunningAtTarget = (startIso, endIso) => {
          if (!startIso || !endIso) return false;
          const s = new Date(startIso);
          let e = new Date(endIso);

          // Extend 23:59 session lookahead window through 1:00 AM
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }

          return s <= targetTime && e > targetTime;
        };

        const events = Array.isArray(data) ? data : (data.events || []);
        const sessions = [];

        const eventMap = {};
        events.forEach(e => {
          if (!isRunningAtTarget(e.startTime, e.endTime)) return;
          const key = `${e.eventId || e.EventId}_${e.startTime || e.StartTime}`;

          let courtsRaw = e.courts || e.Courts || [];
          if (!Array.isArray(courtsRaw)) courtsRaw = [courtsRaw];
          const courtNumbers = courtsRaw
            .map(c => cleanCourtName(c && c.CourtName ? c.CourtName : c))
            .filter(Boolean)
            .sort((a, b) => (parseInt(a) || a) - (parseInt(b) || b));

          if (!eventMap[key]) {
            eventMap[key] = {
              title: cleanTitle(e.title || e.DivisionName || e.EventName || 'Event'),
              startTime: e.startTime || e.StartTime,
              endTime: e.endTime || e.EndTime,
              courts: new Set(courtNumbers),
              players: new Map()
            };
          } else {
            courtNumbers.forEach(c => eventMap[key].courts.add(c));
          }

          let pName = e.playerName;
          if (!pName) {
            const f = e.FirstName || e.MemberFirstName || e.UserFirstName || '';
            const l = e.LastName || e.MemberLastName || e.UserLastName || '';
            if (f) {
              pName = `${f} ${l ? l.charAt(0) : ''}`.trim();
            } else if (e.MemberName) {
              pName = e.MemberName;
            }
          }

          if (pName) {
            const formattedName = toSentenceCase(pName);
            const isChecked = e.checkedIn === true || e.IsCheckedIn === true;
            const currentStatus = eventMap[key].players.get(formattedName);
            eventMap[key].players.set(formattedName, currentStatus || isChecked);
          }
        });

        Object.values(eventMap).forEach(ev => {
          const arr = Array.from(ev.courts);
          const courtsLabel = arr.length > 0 ? `on ${arr.join(', ')}` : 'on TBD';
          
          const sortedPlayers = Array.from(ev.players.entries())
            .map(([name, checkedIn]) => ({ name, checkedIn }))
            .sort((a, b) => a.name.localeCompare(b.name));

          sessions.push({
            title: ev.title,
            courtsLabel: courtsLabel,
            startTime: ev.startTime,
            endTime: ev.endTime,
            players: sortedPlayers
          });
        });

        let bestWindowTag = '';
        if (sessions.length > 0) {
          const windowCounts = {};
          sessions.forEach(item => {
            const w = formatTimeWindow(item.startTime, item.endTime);
            windowCounts[w] = (windowCounts[w] || 0) + 1;
          });
          const bestWindow = Object.keys(windowCounts).reduce((a, b) => windowCounts[a] >= windowCounts[b] ? a : b);
          bestWindowTag = `<span class="header-window">(${bestWindow})</span>`;
        }

        const subtitleText = isPreview 
          ? `Rosters (${targetTimeString} Preview)` 
          : 'Rosters';

        const titleEl = document.getElementById('header-title');
        titleEl.innerHTML = `<span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span>${subtitleText}</span>${bestWindowTag}`;

        const container = document.getElementById('roster-container');
        container.innerHTML = '';

        if (sessions.length === 0) {
          container.className = '';
          container.innerHTML = `
            <div class="no-sessions">
              <h2>No Sessions Found</h2>
            </div>
          `;
          return;
        }

        sessions.sort((a, b) => {
          const keyA = (a.title || '').trim().substring(0, 3);
          const keyB = (b.title || '').trim().substring(0, 3);
          const numA = parseFloat(keyA);
          const numB = parseFloat(keyB);

          if (!isNaN(numA) && !isNaN(numB)) {
            if (numA !== numB) return numA - numB;
          } else {
            const strComp = keyA.localeCompare(keyB, undefined, { numeric: true, sensitivity: 'base' });
            if (strComp !== 0) return strComp;
          }

          return new Date(a.startTime) - new Date(b.startTime);
        });

        const totalSessions = Math.min(sessions.length, 6);
        const isSingle = sessions.length === 1;
        container.className = `count-${totalSessions}`;

        const totalReportPlayers = sessions.reduce((sum, s) => sum + s.players.length, 0);

        let uniformCols = 2;
        let uniformFontSize = 'clamp(1rem, 1.25vw, 1.45rem)';
        let uniformRowGap = '0.7vh';
        let uniformColGap = '1.8vw';

        // 50% larger session titles & courts
        let uniformTitleSize = 'clamp(2.25rem, 2.85vw, 3.45rem)';
        let uniformCourtsSize = 'clamp(1.72rem, 2.18vw, 2.55rem)';

        if (isSingle) {
          uniformTitleSize = 'clamp(2.4rem, 3.0vw, 3.6rem)';
          uniformCourtsSize = 'clamp(1.85rem, 2.3vw, 2.7rem)';
          if (totalReportPlayers > 44) {
            uniformCols = 3;
            uniformFontSize = 'clamp(0.95rem, 1.05vw, 1.2rem)';
            uniformRowGap = '0.5vh';
            uniformColGap = '1.4vw';
          } else if (totalReportPlayers > 22) {
            uniformCols = 2;
            uniformFontSize = 'clamp(1.05rem, 1.15vw, 1.3rem)';
            uniformRowGap = '0.65vh';
          } else {
            uniformCols = 2;
            uniformFontSize = 'clamp(1.2rem, 1.4vw, 1.6rem)';
            uniformRowGap = '0.9vh';
          }
        } else if (totalSessions === 2) {
          uniformTitleSize = 'clamp(2.25rem, 2.85vw, 3.45rem)';
          uniformCourtsSize = 'clamp(1.72rem, 2.18vw, 2.55rem)';
          if (totalReportPlayers > 60) {
            uniformCols = 3;
            uniformFontSize = 'clamp(0.9rem, 1.0vw, 1.15rem)';
            uniformRowGap = '0.45vh';
            uniformColGap = '1.2vw';
          } else if (totalReportPlayers > 30) {
            uniformCols = 2;
            uniformFontSize = 'clamp(1.0rem, 1.1vw, 1.25rem)';
            uniformRowGap = '0.6vh';
          } else {
            uniformCols = 2;
            uniformFontSize = 'clamp(1.15rem, 1.3vw, 1.5rem)';
            uniformRowGap = '0.8vh';
          }
        } else if (totalSessions === 3) {
          uniformTitleSize = 'clamp(1.95rem, 2.25vw, 2.7rem)';
          uniformCourtsSize = 'clamp(1.5rem, 1.88vw, 2.18rem)';
          if (totalReportPlayers > 65) {
            uniformCols = 2;
            uniformFontSize = 'clamp(0.85rem, 0.95vw, 1.15rem)';
            uniformRowGap = '0.4vh';
            uniformColGap = '1.0vw';
          } else if (totalReportPlayers > 30) {
            uniformCols = 2;
            uniformFontSize = 'clamp(0.95rem, 1.08vw, 1.25rem)';
            uniformRowGap = '0.55vh';
            uniformColGap = '1.2vw';
          } else {
            uniformCols = 2;
            uniformFontSize = 'clamp(1.08rem, 1.22vw, 1.4rem)';
            uniformRowGap = '0.7vh';
            uniformColGap = '1.4vw';
          }
        } else {
          uniformTitleSize = 'clamp(1.72rem, 2.0vw, 2.4rem)';
          uniformCourtsSize = 'clamp(1.42rem, 1.65vw, 2.0rem)';
          if (totalReportPlayers > 70) {
            uniformCols = 3;
            uniformFontSize = 'clamp(0.76rem, 0.85vw, 1.0rem)';
            uniformRowGap = '0.3vh';
            uniformColGap = '0.7vw';
          } else if (totalReportPlayers > 40) {
            uniformCols = 2;
            uniformFontSize = 'clamp(0.82rem, 0.92vw, 1.1rem)';
            uniformRowGap = '0.4vh';
            uniformColGap = '1.0vw';
          } else {
            uniformCols = 2;
            uniformFontSize = 'clamp(0.95rem, 1.05vw, 1.25rem)';
            uniformRowGap = '0.55vh';
            uniformColGap = '1.2vw';
          }
        }

        sessions.forEach(item => {
          let s = new Date(item.startTime);
          let e = new Date(item.endTime);
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }

          const isNow = now >= s && now <= e;
          const count = item.players.length;

          const card = document.createElement('div');
          card.className = `roster-card ${isNow ? 'is-now' : ''} ${isSingle ? 'single-session' : ''}`;
          card.style.setProperty('--title-font-size', uniformTitleSize);
          card.style.setProperty('--courts-font-size', uniformCourtsSize);

          const listHtml = count > 0 
            ? item.players.map(p => `
                <div class="player-item ${p.checkedIn ? 'is-checked-in' : 'is-pending'}">
                  <span class="status-dot"></span>
                  <span class="player-name">${p.name}</span>
                </div>
              `).join('')
            : `<div class="player-empty">No registered players</div>`;

          card.innerHTML = `
            <div class="card-header">
              <div class="header-titles">
                <div class="line-title">${item.title}</div>
                <div class="line-courts">${item.courtsLabel}</div>
              </div>
              <div class="card-meta">
                <div class="count-badge">${count} ${count === 1 ? 'Player' : 'Players'}</div>
              </div>
            </div>
            <div class="player-list" style="
              --roster-cols: ${uniformCols};
              --roster-font-size: ${uniformFontSize};
              --roster-row-gap: ${uniformRowGap};
              --roster-col-gap: ${uniformColGap};
            ">
              ${listHtml}
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error("Error updating rosters display:", err);
      }
    }

    refreshDisplay();
    setInterval(refreshDisplay, 30000);
  </script>
</body>
</html>
