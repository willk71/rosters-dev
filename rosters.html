<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court Rosters</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.45);
      --border: rgba(255, 255, 255, 0.1);
      --accent-green: #34c759;
      --accent-green-glow: rgba(52, 199, 89, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 32px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .clock {
      font-size: 1.25rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }

    .session-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .session-header {
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .session-title {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .session-meta {
      font-size: 0.95rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .player-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    /* Player list items & Check-In Indicator */
    .player-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      padding: 6px 0;
      transition: opacity 0.25s ease, color 0.25s ease;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Checked-in state (Bright text + Apple green glowing dot) */
    .player-item.checked-in {
      color: var(--text);
      font-weight: 500;
    }

    .player-item.checked-in .status-dot {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green-glow);
    }

    /* Pending / Not checked-in state (Faded text + subtle outline dot) */
    .player-item.pending {
      color: var(--text-muted);
      font-weight: 400;
    }

    .player-item.pending .status-dot {
      background-color: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Session Rosters</h1>
    <div id="liveClock" class="clock">--:--</div>
  </header>

  <main id="rosterContainer" class="roster-grid">
    <div class="empty-state">Loading schedule...</div>
  </main>

  <script>
    // Update live clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Fetch and render schedule
    async function loadRosters() {
      const container = document.getElementById('rosterContainer');

      try {
        const res = await fetch(`data/schedule.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();

        // Support URL parameter override (e.g., ?ahead=120) for testing
        const urlParams = new URLSearchParams(window.location.search);
        const aheadMinutes = parseInt(urlParams.get('ahead') || '15', 10);

        const now = new Date();
        const lookaheadWindow = new Date(now.getTime() + aheadMinutes * 60 * 1000);

        // Group rows by eventId
        const eventsMap = new Map();

        (Array.isArray(data) ? data : []).forEach(item => {
          if (!item.eventId || !item.startTime || !item.endTime) return;

          const start = new Date(item.startTime);
          const end = new Date(item.endTime);

          // Active session or starts within aheadMinutes
          const isCurrentOrUpcoming = (now >= start && now <= end) || (start > now && start <= lookaheadWindow);
          if (!isCurrentOrUpcoming) return;

          if (!eventsMap.has(item.eventId)) {
            eventsMap.set(item.eventId, {
              title: item.title,
              startTime: start,
              endTime: end,
              courts: item.courts || [],
              players: []
            });
          }

          if (item.playerName) {
            eventsMap.get(item.eventId).players.push({
              name: item.playerName,
              checkedIn: item.checkedIn === true
            });
          }
        });

        if (eventsMap.size === 0) {
          container.innerHTML = `<div class="empty-state">No Active Sessions</div>`;
          return;
        }

        // Generate HTML
        let html = '';
        eventsMap.forEach(session => {
          const timeFormat = { hour: 'numeric', minute: '2-digit' };
          const timeRange = `${session.startTime.toLocaleTimeString([], timeFormat)} – ${session.endTime.toLocaleTimeString([], timeFormat)}`;
          const courtList = session.courts.join(', ') || 'Unassigned';

          const playersHtml = session.players.length > 0
            ? session.players.map(player => `
                <li class="player-item ${player.checkedIn ? 'checked-in' : 'pending'}">
                  <span class="status-dot"></span>
                  <span class="player-name">${player.name}</span>
                </li>
              `).join('')
            : `<li class="player-item pending">No registered players</li>`;

          html += `
            <section class="session-card">
              <div class="session-header">
                <div class="session-title">${session.title}</div>
                <div class="session-meta">
                  <span>${courtList}</span>
                  <span>•</span>
                  <span>${timeRange}</span>
                </div>
              </div>
              <ul class="player-list">
                ${playersHtml}
              </ul>
            </section>
          `;
        });

        container.innerHTML = html;

      } catch (err) {
        console.error('Failed to load roster data:', err);
        container.innerHTML = `<div class="empty-state">Error loading rosters.</div>`;
      }
    }

    loadRosters();
    // Auto refresh every 60 seconds
    setInterval(loadRosters, 60000);
  </script>
</body>
</html>
