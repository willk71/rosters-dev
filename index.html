<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Welcome to IPX! &ndash; Court Assignments</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #242426 0%, #121214 65%, #000000 100%);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-border-active: rgba(255, 214, 10, 0.85);

      --yellow: #ffd60a;
      --text-main: #ffffff;
      --text-sub: #ebebf5;
      --text-muted: #8e8e93;

      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    /* 1. Tiffany Morning: Petrol & Mint Frost (7:00 AM & 9:00 AM) */
    body.theme-tiffany {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0d2826 0%, #061514 60%, #020707 100%);
      --yellow: #2de2b6;
      --card-bg: rgba(45, 226, 182, 0.09);
      --card-border: rgba(45, 226, 182, 0.28);
      --card-border-active: rgba(45, 226, 182, 0.85);
    }
    body.theme-tiffany .session-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(45, 226, 182, 0.05);
    }

    /* 2. US Open Afternoon: Arthur Ashe Navy & Optic Volt (11:00 AM - 5:00 PM) */
    body.theme-usopen {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0a2540 0%, #051329 60%, #020712 100%);
      --yellow: #ccff00;
      --card-bg: rgba(10, 37, 64, 0.7);
      --card-border: rgba(204, 255, 0, 0.3);
      --card-border-active: rgba(204, 255, 0, 0.9);
    }
    body.theme-usopen .session-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(204, 255, 0, 0.06);
    }

    /* 3. Apple Prime: OLED Black & Canary Yellow (5:30 PM - 7:00 PM) */
    body.theme-apple {
      --bg-gradient: radial-gradient(circle at 50% 10%, #242426 0%, #121214 65%, #000000 100%);
      --yellow: #ffd60a;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-border-active: rgba(255, 214, 10, 0.85);
    }

    /* 4. Rolex Evening: British Racing Green & Champagne Gold (7:30 PM - 9:00 PM) */
    body.theme-rolex {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0e2417 0%, #07130c 60%, #020503 100%);
      --yellow: #e5c158;
      --card-bg: rgba(14, 36, 23, 0.65);
      --card-border: rgba(229, 193, 88, 0.3);
      --card-border-active: rgba(229, 193, 88, 0.9);
    }
    body.theme-rolex .session-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(229, 193, 88, 0.05);
    }

    /* 5. Porsche Late Night: Carbon Gunmetal & Signal Amber (9:30 PM onward) */
    body.theme-porsche {
      --bg-gradient: radial-gradient(circle at 50% 10%, #2a1b12 0%, #150d09 60%, #050302 100%);
      --yellow: #ff9f0a;
      --card-bg: rgba(42, 27, 18, 0.55);
      --card-border: rgba(255, 159, 10, 0.32);
      --card-border-active: rgba(255, 159, 10, 0.9);
    }
    body.theme-porsche .session-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(255, 159, 10, 0.08);
    }

    /* 6. Roland-Garros: Paris Smoked Clay & Scorched Orange */
    body.theme-rolandgarros {
      --bg-gradient: radial-gradient(circle at 50% 10%, #301712 0%, #160a08 60%, #060202 100%);
      --yellow: #ff6e40;
      --card-bg: rgba(48, 23, 18, 0.65);
      --card-border: rgba(255, 110, 64, 0.35);
      --card-border-active: rgba(255, 110, 64, 0.95);
    }
    body.theme-rolandgarros .session-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 0 24px rgba(255, 110, 64, 0.08);
    }

    /* 7. Australian Open: Melbourne Oceanic Trench & Laser Cyan */
    body.theme-ausopen {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0a2b47 0%, #041424 60%, #01060d 100%);
      --yellow: #00f5d4;
      --card-bg: rgba(7, 36, 64, 0.7);
      --card-border: rgba(0, 245, 212, 0.35);
      --card-border-active: rgba(0, 245, 212, 0.95);
    }
    body.theme-ausopen .session-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 0 25px rgba(0, 245, 212, 0.08);
    }

    /* 8. Miami Vice: Dark Velvet Plum & Electric Hot Pink */
    body.theme-vice {
      --bg-gradient: radial-gradient(circle at 50% 10%, #290d33 0%, #130519 60%, #040106 100%);
      --yellow: #ff2a85;
      --card-bg: rgba(40, 14, 48, 0.65);
      --card-border: rgba(255, 42, 133, 0.32);
      --card-border-active: rgba(255, 42, 133, 0.95);
    }
    body.theme-vice .session-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(255, 42, 133, 0.08);
    }

    /* 9. Gulf Racing: Le Mans Petrol Blue & Tangerine Orange */
    body.theme-gulfracing {
      --bg-gradient: radial-gradient(circle at 50% 10%, #152b33 0%, #0b171c 60%, #020506 100%);
      --yellow: #ff7800;
      --card-bg: rgba(18, 41, 51, 0.65);
      --card-border: rgba(255, 120, 0, 0.35);
      --card-border-active: rgba(255, 120, 0, 0.95);
    }
    body.theme-gulfracing .session-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 0 24px rgba(255, 120, 0, 0.08);
    }

    /* 10. Masters: Augusta Deep Pine & Azalea Gold */
    body.theme-masters {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0b291d 0%, #05140e 60%, #010403 100%);
      --yellow: #f5b700;
      --card-bg: rgba(10, 38, 27, 0.68);
      --card-border: rgba(245, 183, 0, 0.32);
      --card-border-active: rgba(245, 183, 0, 0.92);
    }
    body.theme-masters .session-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 0 24px rgba(245, 183, 0, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 2.2vh 3vw 1.5vh 3vw;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1.2vh;
      flex-shrink: 0;
    }

    .header-left {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: baseline;
    }

    .header-left h1 {
      font-size: clamp(2rem, 3.2vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: baseline;
    }

    .header-separator {
      margin: 0 0.55em;
      color: var(--text-muted);
      font-weight: 300;
      opacity: 0.7;
    }

    .header-window {
      color: var(--yellow);
      font-weight: 600;
      margin-left: 0.4em;
    }

    main {
      flex: 1;
      display: grid;
      gap: 2vh 2vw;
      margin-top: 2vh;
      overflow: hidden;
      min-height: 0;
    }

    /* 1 session: full centered card */
    main.count-1 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    /* 2 sessions: 2 stacked rows spanning full width */
    main.count-2 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }

    /* 3 sessions: 3 stacked rows spanning full width */
    main.count-3 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr 1fr;
    }

    /* 4 sessions: 2x2 grid */
    main.count-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    /* 5-6 sessions: 3x2 grid */
    main.count-5, main.count-6 {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .session-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 14px solid var(--yellow);
      border-radius: 22px;
      padding: 3vh 3vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.2vh;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      min-height: 0;
      overflow: hidden;
    }

    .session-card.is-now {
      border-color: var(--card-border-active);
    }

    main.count-2 .session-card,
    main.count-3 .session-card {
      padding: 2.2vh 3.5vw;
      gap: 0.8vh;
    }

    /* Scaled titles */
    .session-title {
      font-size: clamp(3.0rem, 4.5vw, 6.0rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main.count-1 .session-title {
      font-size: clamp(4.5rem, 7.5vw, 9.0rem);
    }

    main.count-2 .session-title {
      font-size: clamp(3.6rem, 5.4vw, 6.9rem);
    }

    main.count-3 .session-title {
      font-size: clamp(2.8rem, 4.0vw, 5.2rem);
    }

    main.count-4 .session-title {
      font-size: clamp(2.4rem, 3.3vw, 4.2rem);
    }

    /* Scaled courts on 2nd line */
    .session-courts {
      font-size: clamp(2.7rem, 3.9vw, 5.1rem);
      font-weight: 600;
      color: var(--yellow);
      letter-spacing: -0.01em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main.count-1 .session-courts {
      font-size: clamp(4.2rem, 6.75vw, 7.8rem);
    }

    main.count-2 .session-courts {
      font-size: clamp(3.3rem, 5.1vw, 6.6rem);
    }

    main.count-3 .session-courts {
      font-size: clamp(2.6rem, 3.8vw, 4.8rem);
    }

    main.count-4 .session-courts {
      font-size: clamp(2.1rem, 2.7vw, 3.6rem);
    }

    footer {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 0.8vh;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.45);
      font-variant-numeric: tabular-nums;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 0.4vh;
    }

    .footer-meta-pills {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
    }

    .footer-meta-pills span {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .footer-right {
      display: flex;
      align-items: baseline;
      gap: 2vw;
      text-align: right;
    }

    /* Same visual prominence as clock */
    .footer-countdown-container {
      display: none;
      align-items: baseline;
      gap: 0.8rem;
    }

    .footer-countdown-container.is-active {
      display: inline-flex;
    }

    .countdown-label {
      font-size: clamp(1rem, 1.35vw, 1.6rem);
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .countdown-clock {
      font-size: clamp(2.4rem, 3.8vw, 4.4rem);
      font-weight: 300;
      color: var(--yellow);
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .footer-clock {
      font-size: clamp(2.4rem, 3.8vw, 4.4rem);
      font-weight: 300;
      color: var(--yellow);
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .no-sessions {
      grid-column: 1 / -1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      text-align: center;
      padding: 6vh;
    }

    .no-sessions h2 {
      font-size: clamp(1.8rem, 2.8vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 id="header-title">
        <span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span id="board-title-text">Sessions</span>
      </h1>
    </div>
  </header>

  <main id="session-container">
    <div class="no-sessions">
      <h2>Loading Sessions...</h2>
    </div>
  </main>

  <footer>
    <div class="footer-left">
      <div class="footer-meta-pills">
        <span id="theme-pill">Theme: --</span>
        <span>&bull;</span>
        <span id="target-mode-pill">Target: --</span>
        <span>&bull;</span>
        <span id="data-refresh-time">Data Sync: --</span>
        <span>&bull;</span>
        <span id="page-refresh-time">Display Updated: --</span>
      </div>
    </div>
    
    <div class="footer-right">
      <div class="footer-countdown-container" id="countdown-box">
        <span class="countdown-label">Current Sessions Ends/Next Sessions Starts:</span>
        <span class="countdown-clock" id="transition-countdown">--:--</span>
      </div>
      <div class="footer-clock" id="live-clock">--:-- --</div>
    </div>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hasExplicitAhead = urlParams.has('ahead');
    const isNamed60 = window.location.pathname.includes('60');
    const defaultAhead = isNamed60 ? '60' : '15';
    const lookaheadMinutes = parseInt(urlParams.get('ahead') || defaultAhead, 10);
    
    const isPreview = hasExplicitAhead && lookaheadMinutes !== 15;

    let nextTransitionTargetEpoch = null;

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      updateCountdown();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateCountdown() {
      const countdownBox = document.getElementById('countdown-box');
      const countdownVal = document.getElementById('transition-countdown');
      
      if (!nextTransitionTargetEpoch) {
        countdownBox.classList.remove('is-active');
        return;
      }

      const diffMs = nextTransitionTargetEpoch - Date.now();

      // Only show if transition is within 15 minutes (15 * 60 * 1000 = 900,000 ms), otherwise hide completely
      if (diffMs > 0 && diffMs <= 15 * 60 * 1000) {
        const totalSecs = Math.floor(diffMs / 1000);
        const m = Math.floor(totalSecs / 60);
        const s = totalSecs % 60;
        countdownVal.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        countdownBox.classList.add('is-active');
      } else {
        countdownBox.classList.remove('is-active');
      }
    }

    const themeDisplayNames = {
      'theme-tiffany': 'Tiffany',
      'theme-usopen': 'US Open',
      'theme-apple': 'Apple',
      'theme-rolex': 'Rolex',
      'theme-porsche': 'Porsche',
      'theme-rolandgarros': 'Roland-Garros',
      'theme-ausopen': 'Australian Open',
      'theme-vice': 'Miami Vice',
      'theme-gulfracing': 'Gulf Racing',
      'theme-masters': 'Masters'
    };

    function applyDynamicTheme(targetTime) {
      const urlTheme = (urlParams.get('theme') || '').toLowerCase().trim();
      const allThemes = [
        'theme-tiffany',
        'theme-usopen',
        'theme-apple',
        'theme-rolex',
        'theme-porsche',
        'theme-rolandgarros',
        'theme-ausopen',
        'theme-vice',
        'theme-gulfracing',
        'theme-masters'
      ];
      
      let themeToApply = 'theme-apple';

      if (urlTheme && allThemes.includes(`theme-${urlTheme}`)) {
        themeToApply = `theme-${urlTheme}`;
      } else {
        const totalMinutes = targetTime.getHours() * 60 + targetTime.getMinutes();

        // 7:00 AM (420) to 10:59 AM (659) -> Sessions starting 7:00 AM & 9:00 AM
        if (totalMinutes >= 420 && totalMinutes < 660) {
          themeToApply = 'theme-tiffany';
        }
        // 11:00 AM (660) to 5:14 PM (1034) -> Sessions starting 11:00 AM - 5:00 PM
        else if (totalMinutes >= 660 && totalMinutes < 1035) {
          themeToApply = 'theme-usopen';
        }
        // 5:15 PM (1035) to 7:14 PM (1154) -> Sessions starting 5:30 PM - 7:00 PM
        else if (totalMinutes >= 1035 && totalMinutes < 1155) {
          themeToApply = 'theme-apple';
        }
        // 7:15 PM (1155) to 9:14 PM (1274) -> Sessions starting 7:30 PM - 9:00 PM
        else if (totalMinutes >= 1155 && totalMinutes < 1275) {
          themeToApply = 'theme-rolex';
        }
        // 9:15 PM (1275) through late night -> Sessions starting 9:30 PM onward
        else {
          themeToApply = 'theme-porsche';
        }
      }

      document.body.classList.remove(...allThemes);
      document.body.classList.add(themeToApply);

      const displayName = themeDisplayNames[themeToApply] || 'Default';
      const themePill = document.getElementById('theme-pill');
      if (themePill) {
        themePill.textContent = `Theme: ${displayName}`;
      }
    }

    function formatTime(isoString, isEndTime = false) {
      if (!isoString) return '';
      const d = new Date(isoString);

      // Override late-night CourtReserve truncations (23:59 -> 1:00 AM)
      if (isEndTime && d.getHours() === 23 && d.getMinutes() === 59) {
        return '1:00 AM';
      }

      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function formatTimeWindow(startIso, endIso) {
      if (!startIso || !endIso) return '';
      const t1 = formatTime(startIso, false);
      const t2 = formatTime(endIso, true);
      const parts1 = t1.split(' ');
      const parts2 = t2.split(' ');
      if (parts1.length === 2 && parts2.length === 2 && parts1[1] === parts2[1]) {
        return `${parts1[0]} \u2013 ${t2}`;
      }
      return `${t1} \u2013 ${t2}`;
    }

    function cleanCourtName(rawName) {
      if (!rawName) return '';
      return String(rawName)
        .replace(/\s*\(\s*Livestreaming\s*\)/gi, '')
        .replace(/\s*\(\s*Streaming\s*\)/gi, '')
        .replace(/^Court\s*/i, '')
        .trim();
    }

    function toSentenceCase(str) {
      if (!str) return '';
      return String(str).replace(/([^\W_]+[^\s-]*) */g, (txt) => {
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
      }).trim();
    }

    function cleanTitle(rawTitle) {
      if (!rawTitle) return '';
      let firstSegment = String(rawTitle).split('|')[0].trim();
      firstSegment = firstSegment
        .replace(/\bSessions?\b/gi, '')
        .replace(/\bOpen\s*Play\b/gi, '')
        .replace(/\bPrime\s*Time\b/gi, '');

      firstSegment = firstSegment.replace(/[-–—/,\s]+$/, '').trim();
      firstSegment = firstSegment.replace(/(\d+(?:\.\d+)?)\s*[-–—]\s*(\d+(?:\.\d+)?)/g, '$1 \u2013 $2');
      return toSentenceCase(firstSegment);
    }

    async function refreshDisplay() {
      try {
        const res = await fetch(`data/schedule.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Schedule file not found");
        const data = await res.json();

        const now = new Date();
        document.getElementById('page-refresh-time').textContent = `Display: ${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true })}`;
        
        if (data.lastUpdated) {
          const syncDate = new Date(data.lastUpdated);
          document.getElementById('data-refresh-time').textContent = `Data Sync: ${syncDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        }

        const targetTime = new Date(now.getTime() + lookaheadMinutes * 60 * 1000);
        const targetTimeString = targetTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });

        // Apply theme 15 minutes before session begins
        applyDynamicTheme(targetTime);

        document.getElementById('target-mode-pill').textContent = isPreview 
          ? `Target: ${targetTimeString}` 
          : 'Target: Live';

        const isRunningAtTarget = (startIso, endIso) => {
          if (!startIso || !endIso) return false;
          const s = new Date(startIso);
          let e = new Date(endIso);

          // Extend late-night sessions ending at 23:59 through 1:00 AM
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }

          return s <= targetTime && e > targetTime;
        };

        const events = Array.isArray(data) ? data : (data.events || []);

        // Detect upcoming transition epoch (session start or end)
        let closestFutureEpoch = null;
        events.forEach(e => {
          const s = new Date(e.startTime || e.StartTime).getTime();
          let endDt = new Date(e.endTime || e.EndTime);
          if (endDt.getHours() === 23 && endDt.getMinutes() === 59) {
            endDt = new Date(endDt.getTime() + 61 * 60 * 1000);
          }
          const endEpoch = endDt.getTime();

          [s, endEpoch].forEach(epoch => {
            if (epoch > now.getTime()) {
              if (closestFutureEpoch === null || epoch < closestFutureEpoch) {
                closestFutureEpoch = epoch;
              }
            }
          });
        });
        nextTransitionTargetEpoch = closestFutureEpoch;
        updateCountdown();

        const eventMap = {};

        events.forEach(e => {
          if (!isRunningAtTarget(e.startTime, e.endTime)) return;
          const key = `${e.eventId || e.EventId}_${e.startTime || e.StartTime}`;

          let courtsRaw = e.courts || e.Courts || [];
          if (!Array.isArray(courtsRaw)) courtsRaw = [courtsRaw];
          const courtNumbers = courtsRaw
            .map(c => cleanCourtName(c && c.CourtName ? c.CourtName : c))
            .filter(Boolean)
            .sort((a, b) => (parseInt(a) || a) - (parseInt(b) || b));

          if (!eventMap[key]) {
            eventMap[key] = {
              title: cleanTitle(e.title || e.DivisionName || e.EventName || 'Event'),
              startTime: e.startTime || e.StartTime,
              endTime: e.endTime || e.EndTime,
              courts: new Set(courtNumbers)
            };
          } else {
            courtNumbers.forEach(c => eventMap[key].courts.add(c));
          }
        });

        const sessions = [];
        Object.values(eventMap).forEach(ev => {
          const arr = Array.from(ev.courts);
          const courtsLabel = arr.length > 0 ? `on ${arr.join(' ')}` : 'on TBD';

          sessions.push({
            title: ev.title,
            courtsLabel: courtsLabel,
            startTime: ev.startTime,
            endTime: ev.endTime
          });
        });

        let bestWindowTag = '';
        if (sessions.length > 0) {
          const windowCounts = {};
          sessions.forEach(item => {
            const w = formatTimeWindow(item.startTime, item.endTime);
            windowCounts[w] = (windowCounts[w] || 0) + 1;
          });
          const bestWindow = Object.keys(windowCounts).reduce((a, b) => windowCounts[a] >= windowCounts[b] ? a : b);
          bestWindowTag = `<span class="header-window">(${bestWindow})</span>`;
        }

        const subtitleText = isPreview 
          ? `Sessions (${targetTimeString} Preview)` 
          : 'Sessions';

        const titleEl = document.getElementById('header-title');
        titleEl.innerHTML = `<span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span>${subtitleText}</span>${bestWindowTag}`;

        const container = document.getElementById('session-container');
        container.innerHTML = '';

        if (sessions.length === 0) {
          container.className = '';
          container.innerHTML = `
            <div class="no-sessions">
              <h2>No Active Sessions</h2>
            </div>
          `;
          return;
        }

        sessions.sort((a, b) => {
          const keyA = (a.title || '').trim().substring(0, 3);
          const keyB = (b.title || '').trim().substring(0, 3);
          const numA = parseFloat(keyA);
          const numB = parseFloat(keyB);

          if (!isNaN(numA) && !isNaN(numB)) {
            if (numA !== numB) return numA - numB;
          } else {
            const strComp = keyA.localeCompare(keyB, undefined, { numeric: true, sensitivity: 'base' });
            if (strComp !== 0) return strComp;
          }

          return new Date(a.startTime) - new Date(b.startTime);
        });

        const totalSessions = Math.min(sessions.length, 6);
        container.className = `count-${totalSessions}`;

        sessions.forEach(item => {
          let s = new Date(item.startTime);
          let e = new Date(item.endTime);
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }

          const isNow = now >= s && now <= e;
          const card = document.createElement('div');
          card.className = `session-card ${isNow ? 'is-now' : ''}`;

          card.innerHTML = `
            <div class="session-title">${item.title}</div>
            <div class="session-courts">${item.courtsLabel}</div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error("Error updating sessions display:", err);
      }
    }

    refreshDisplay();
    setInterval(refreshDisplay, 30000);
  </script>
</body>
</html>
