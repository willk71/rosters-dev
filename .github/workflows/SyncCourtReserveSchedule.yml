name: Sync CourtReserve Schedule

on:
  schedule:
    # 15-minute baseline around the clock
    - cron: '*/15 * * * *'

    # Burst 1: 5:20 PM - 6:30 PM EDT (21:20 - 22:30 UTC)
    - cron: '20-55/5 21 * * *'
    - cron: '0-30/5 22 * * *'

    # Burst 2: 7:20 PM - 8:30 PM EDT (23:20 - 00:30 UTC)
    - cron: '20-55/5 23 * * *'
    - cron: '0-30/5 0 * * *'

    # Burst 3: 9:20 PM - 10:30 PM EDT (01:20 - 02:30 UTC)
    - cron: '20-55/5 1 * * *'
    - cron: '0-30/5 2 * * *'

  workflow_dispatch:

concurrency:
  group: sync-courtreserve
  cancel-in-progress: false

jobs:
  sync-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Reservations and Events
        env:
          CR_USER: ${{ secrets.CR_USERNAME }}
          CR_PASS: ${{ secrets.CR_PASSWORD }}
        run: |
          mkdir -p data

          TODAY_NY=$(TZ="America/New_York" date +%Y-%m-%d)
          echo "Current NY Date: $TODAY_NY"

          # 36-hour window (-12h to +24h)
          FROM_UTC=$(date -u -d "-12 hours" +%Y-%m-%dT%H:%M:%SZ)
          TO_UTC=$(date -u -d "+24 hours" +%Y-%m-%dT%H:%M:%SZ)

          AUTH_HEADER="Basic $(echo -n "${CR_USER}:${CR_PASS}" | base64 -w 0)"

          # 1. Fetch Reservations
          RES_URL="https://api.courtreserve.com/api/v1/reservationreport/listactive?reservationsFromDate=${FROM_UTC}&reservationsToDate=${TO_UTC}"
          curl -s -H "Authorization: $AUTH_HEADER" -H "Accept: application/json" "$RES_URL" -o data/reservations.json

          # 2. Fetch Events & Registrations
          EVENT_URL="https://api.courtreserve.com/api/v1/eventregistrationreport/listactive?eventDateFrom=${FROM_UTC}&eventDateTo=${TO_UTC}&includeCourts=true&includePartnerInfo=true&includeGuests=true&includeCheckInInfo=true&includeAttendance=true"          curl -s -H "Authorization: $AUTH_HEADER" -H "Accept: application/json" "$EVENT_URL" -o data/events.json

      - name: Debug Raw Attendee Record
        run: |
          echo "=== SEARCHING FOR WILL K IN RAW EVENTS DATA ==="
          jq '.. | select(.MemberName? == "Will K" or .FirstName? == "Will" or .LastName? == "K")' data/events.json || true
          echo "==============================================="

      - name: Process Schedule JSON
        run: |
          TODAY_NY=$(TZ="America/New_York" date +%Y-%m-%d)

          jq -n \
            --slurpfile res data/reservations.json \
            --slurpfile ev data/events.json \
            '{
              lastUpdated: (now | todate),
              date: "'"$TODAY_NY"'",
              reservations: [
                ($res[0].Data // $res[0] // [])[] | {
                  court: (.Courts // .CourtName // ""),
                  holderLabel: (
                    if .FirstName then
                      ("(" + (.FirstName | split(" ")[0]) + (if .LastName then " " + (.LastName[0:1]) else "" end) + ")")
                    elif .MemberName then
                      ("(" + (.MemberName | split(" ")[0]) + " " + ((.MemberName | split(" ")[1] // "")[0:1]) + ")")
                    else "" end
                  ),
                  startTime: .StartTime,
                  endTime: .EndTime
                }
              ],
              events: [
                ($ev[0].Data // $ev[0] // [])[] | select(.IsPublic != false and .IsHidden != true) | {
                  eventId: .EventId,
                  title: (.DivisionName // .EventName // "Event"),
                  startTime: .StartTime,
                  endTime: .EndTime,
                  courts: (if .Courts then [(.Courts[]?.CourtName // .Courts[]? // empty)] else [] end),
                  playerName: (
                    if .FirstName then
                      ((.FirstName | split(" ")[0]) + (if .LastName then " " + (.LastName[0:1]) else "" end))
                    elif .MemberName then
                      ((.MemberName | split(" ")[0]) + " " + ((.MemberName | split(" ")[1] // "")[0:1]))
                    else "" end
                  ),
                  checkedIn: (
                    if (
                      .IsCheckedIn == true or 
                      .CheckedIn == true or 
                      .HasCheckedIn == true or
                      .AttendanceStatus == 1 or 
                      .AttendanceStatus == "1" or
                      .AttendanceStatus == "CheckedIn" or 
                      .AttendanceStatus == "Attended" or 
                      .AttendanceStatus == "Present" or
                      (.CheckInDateTime != null and .CheckInDateTime != "") or
                      (.CheckInDate != null and .CheckInDate != "")
                    ) then
                      true
                    else
                      false
                    end
                  )
                }
              ]
            }' > data/schedule.json

          rm -f data/reservations.json data/events.json

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "Auto-update CourtReserve schedule (NY Time) [skip ci]"
            git pull --rebase
            git push origin main
          fi
